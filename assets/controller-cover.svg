<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">Controller task graph concept</title><desc id="d">A dark task graph connecting mission, execution, review, and result nodes.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9ff45" stroke-opacity=".055"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="14"/></filter></defs>
  <rect width="1600" height="1000" fill="#0d110d"/><rect x="40" y="40" width="1520" height="920" fill="url(#grid)" stroke="#475147"/>
  <g fill="none" stroke="#7f937a" stroke-width="3"><path d="M340 500H540M810 500h170M1250 500h90M675 410V260h360M675 590v160h360"/><path d="M530 490l18 10-18 10M970 490l18 10-18 10M1330 490l18 10-18 10" stroke="#c9ff45"/></g>
  <g font-family="Consolas,'Microsoft YaHei',sans-serif"><g><rect x="100" y="410" width="240" height="180" fill="#161c16" stroke="#c9ff45" stroke-width="3"/><text x="130" y="456" fill="#7f937a" font-size="18">控制平面</text><text x="130" y="520" fill="#edf3e7" font-size="38">任务</text><text x="130" y="554" fill="#c9ff45" font-size="17">就绪 / 3 个任务</text></g><g><rect x="548" y="410" width="262" height="180" fill="#161c16" stroke="#647064"/><text x="578" y="456" fill="#7f937a" font-size="18">01 / 执行</text><text x="578" y="520" fill="#edf3e7" font-size="38">智能体</text><text x="578" y="554" fill="#aeb8aa" font-size="17">会话已路由</text></g><g><rect x="988" y="410" width="262" height="180" fill="#161c16" stroke="#647064"/><text x="1018" y="456" fill="#7f937a" font-size="18">02 / 审查</text><text x="1018" y="520" fill="#edf3e7" font-size="38">检查</text><text x="1018" y="554" fill="#aeb8aa" font-size="17">等待证据</text></g><g><rect x="1340" y="410" width="170" height="180" fill="#c9ff45"/><text x="1370" y="456" fill="#425221" font-size="18">03</text><text x="1370" y="520" fill="#101510" font-size="33">通过</text><text x="1370" y="554" fill="#425221" font-size="15">已接受</text></g><g><rect x="900" y="190" width="270" height="90" fill="#131813" stroke="#465146"/><text x="930" y="226" fill="#7f937a" font-size="16">会话路由</text><text x="930" y="257" fill="#edf3e7" font-size="19">线程 / 工作树</text></g><g><rect x="900" y="720" width="270" height="90" fill="#131813" stroke="#465146"/><text x="930" y="756" fill="#7f937a" font-size="16">安全边界</text><text x="930" y="787" fill="#edf3e7" font-size="19">范围 / 预算</text></g><text x="90" y="105" fill="#c9ff45" font-size="21" letter-spacing="7">CONTROLLER / 任务图</text><text x="1510" y="920" text-anchor="end" fill="#7f937a" font-size="18">追踪编号 0726-A</text></g>
  <circle cx="340" cy="500" r="16" fill="#c9ff45" opacity=".16" filter="url(#glow)"/><circle cx="340" cy="500" r="7" fill="#c9ff45"/>
